<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Opus 5.5 実践ガイド（スライド版）</title>
<meta name="description" content="動画で紹介した「Claude Opus 5.5 実践ガイド」全22ページを、スライドの見た目のまま見られます。このページでそのままめくれるほか、Googleスライドで開いてコピーやダウンロードもできます。">
<style>
  :root{
    --brand:#D9774F; --brand-deep:#C15640; --brand-soft:rgba(217,119,79,.12);
    --bg:#F1ECE3; --paper:#FBF8F2; --ink:#2A2620; --ink-mid:#6E6557; --line:#E4D9C7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
    line-height:1.75;padding:26px 18px 44px;}
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:22px;font-weight:900;line-height:1.4;margin-bottom:8px;}
  .lead{font-size:14.5px;color:var(--ink-mid);margin-bottom:18px;}
  .open{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:800;
    border-radius:12px;padding:12px 22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .open:hover{background:var(--brand-deep);}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .note{font-size:13px;color:var(--ink-mid);margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Claude Opus 5.5 実践ガイド（スライド版）</h1>
  <p class="lead">価格・性能・最初にやる設定・実際に作られた作品まで、全22ページ。下でそのままめくれます。</p>
  <a class="open" href="https://docs.google.com/presentation/d/13Qpt9H6t0oTXT0iD2KW_F58PGoYz0qKH/edit?usp=sharing" target="_blank" rel="noopener">Googleスライドで開く ↗</a>
  <div class="frame">
    <iframe src="https://drive.google.com/file/d/13Qpt9H6t0oTXT0iD2KW_F58PGoYz0qKH/preview" title="Claude Opus 5.5 実践ガイド" allow="autoplay" loading="lazy"></iframe>
  </div>
  <p class="note">Googleスライドで開いたら、「ファイル」→「ダウンロード」でPowerPointやPDFとして保存できます。</p>
</div>
</body>
</html>
