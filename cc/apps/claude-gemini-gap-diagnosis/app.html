<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude × Gemini 穴埋め診断アプリ</title>
<meta name="description" content="6問に答えると、Claudeに足りない「音声入力・動画・長時間タスク」の穴を洗い出し、Geminiのどの機能を足すべきか（またはClaudeだけで足りるか）を判定します。">
<style>
  :root{ --brand:#D9774F; --deep:#C15640; --ink:#2A2620; --mid:#6E6557; --line:#E4D9C7; --paper:#FBF8F2; --bg:#F1ECE3; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;padding:24px 16px;}
  .wrap{max-width:640px;margin:0 auto;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:28px 24px;}
  h1{font-size:22px;font-weight:800;margin-bottom:6px;}
  .sub{font-size:13.5px;color:var(--mid);margin-bottom:20px;}
  .prog{font-size:12px;color:var(--mid);margin-bottom:14px;font-weight:700;}
  .q{font-size:16.5px;font-weight:800;margin-bottom:14px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  button.opt{text-align:left;font-size:14.5px;font-family:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;color:var(--ink);transition:.15s;}
  button.opt:hover{border-color:var(--brand);background:#fff;}
  .nav{margin-top:16px;display:flex;gap:10px;}
  .nav button{font-family:inherit;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer;color:var(--deep);}
  .nav button:disabled{opacity:.4;cursor:default;}
  .result h2{font-size:19px;font-weight:800;margin-bottom:4px;}
  .lead{font-size:14px;color:var(--mid);margin-bottom:16px;}
  .rec{border:1.5px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--bg);}
  .rec .t{font-weight:800;font-size:14.5px;margin-bottom:4px;}
  .rec .d{font-size:13px;color:var(--mid);}
  .rec.none{border-left-color:var(--line);}
  .tag{display:inline-block;font-size:11px;font-weight:800;background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:8px;}
  .restart{margin-top:8px;}
  .foot{font-size:11.5px;color:var(--mid);margin-top:18px;border-top:1px solid var(--line);padding-top:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Claude × Gemini 穴埋め診断アプリ</h1>
  <p class="sub">6問に答えると、Claude に足りない「音声入力・動画・長時間タスク」の穴と、Gemini のどの機能を足すべきか（または Claude だけで足りるか）を判定します。</p>
  <div id="app"></div>
  <div class="foot">判定はあなたの回答だけで完結し、どこにも送信されません。仕様・提供状況は2026年8月時点。最終確認は各公式サイトで。</div>
</div>
<script>
const QS = [
  { q: "会議・打ち合わせ・インタビューなど「録音した音声」を、後から文字に起こす作業がありますか？",
    a: [["週1回以上ある",{transcribe:2}],["たまにある",{transcribe:1}],["ほぼ無い",{}]] },
  { q: "SNS・説明用・プロトタイプなど、短い動画を自分で作りますか？（作りたいですか？）",
    a: [["作っている / これから作る",{video:2}],["興味はある",{video:1}],["予定は無い",{}]] },
  { q: "声でメールや予定を操作したいですか？（探す・要約・アーカイブ・削除など）",
    a: [["毎日やりたい",{voice:2}],["少し興味がある",{voice:1}],["不要",{}]] },
  { q: "毎朝、その日の予定と重要メールを「音声でまとめて」聞きたいですか？",
    a: [["聞きたい（今は自分で確認していて手間）",{brief:2}],["どちらでもない",{}]] },
  { q: "数日〜数週間かかる調べ物・資料づくりを、AI に裏で少しずつ進めさせたいですか？",
    a: [["進めさせたい",{spark:2}],["そこまでは不要",{}]] },
  { q: "Google AI の有料プラン（Plus 以上）に課金する意思はありますか？",
    a: [["ある",{paid:2}],["条件次第で検討",{paid:1}],["今は無い",{paid:0}]] },
];
let step = 0;
const score = { transcribe:0, video:0, voice:0, brief:0, spark:0, paid:0 };
const picks = new Array(QS.length).fill(null);
const app = document.getElementById('app');

function render(){
  if (step < QS.length){
    const item = QS[step];
    app.innerHTML = '<div class="prog">質問 ' + (step+1) + ' / ' + QS.length + '</div>' +
      '<div class="q">' + item.q + '</div><div class="opts"></div>' +
      '<div class="nav"><button id="back">← 戻る</button></div>';
    const opts = app.querySelector('.opts');
    item.a.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = opt[0];
      b.onclick = () => choose(i);
      opts.appendChild(b);
    });
    const back = app.querySelector('#back');
    back.disabled = step === 0;
    back.onclick = () => { step--; render(); };
  } else {
    showResult();
  }
}
function choose(i){
  if (picks[step] !== null){
    const prev = QS[step].a[picks[step]][1];
    for (const k in prev) score[k] -= prev[k];
  }
  picks[step] = i;
  const eff = QS[step].a[i][1];
  for (const k in eff) score[k] += eff[k];
  step++; render();
}
function rec(t, d, none){
  return '<div class="rec' + (none ? ' none' : '') + '"><div class="t">' + t + '</div><div class="d">' + d + '</div></div>';
}
function showResult(){
  const gaps = [];
  if (score.transcribe >= 1) gaps.push(['文字起こし', score.transcribe]);
  if (score.video >= 1) gaps.push(['動画', score.video]);
  if (score.voice >= 1 || score.brief >= 2 || score.spark >= 2) gaps.push(['声・長時間タスク', Math.max(score.voice, score.brief, score.spark)]);
  gaps.sort((a,b) => b[1] - a[1]);

  let html = '<div class="result"><h2>あなたの穴は ' + gaps.length + ' 個</h2>';
  html += '<p class="lead">' + (gaps.length ? 'まず埋めるべきは「' + gaps[0][0] + '」の穴。一度に1つずつ埋めるのが定着のコツです。' : 'いまの Claude 中心の使い方で不足はほぼありません。') + '</p>';

  if (score.transcribe >= 1){
    html += rec('Gemini 3.5 Transcribe を「文字起こし専用」で足す',
      (score.transcribe >= 2 ? '頻度が高いので効果が大きい枠です。' : 'まずは無料枠で1本試す程度で十分。') +
      ' Claude の API は音声ファイルを受け付けないため、この作業は Claude では完結しません。AI Studio の無料枠から始められます。まず直近の録音を1本入れて、出たテキストを Claude で「決定事項とToDoを抜き出して」と整形するのがおすすめ。');
  }
  if (score.video >= 1){
    const which = 'このあと「安く量を作りたい」なら Veo 3.1 Lite（720p が半額）、「延長やフレーム指定で作り込みたい」なら Omni 1.1 Flash。';
    html += rec('動画は Gemini Omni 1.1 Flash / Veo 3.1 を試す',
      'Claude は画像生成すらしないので、動画は完全に守備範囲の外です。360p の下書きを2〜3本作り、当たりだけ 1080p / 4K に上げる進め方が安上がり（1本40秒が上限）。' + which);
  }
  if (score.voice >= 1){
    html += rec('声でメール操作は、まず Claude の音声モードで足りるか試す',
      'Claude の音声モードも連携アプリ（Gmail・カレンダー等）の操作に対応しています。3日ほど使って足りなければ、Gemini Live に切り替えを検討。いきなり両方使うと二重管理になります。');
  }
  if (score.brief >= 2){
    html += rec('Gemini Live の Daily Brief（Gmail＋カレンダーを音声ダイジェストに）',
      '毎朝の確認をゼロにできる機能です。' + (score.paid === 0 ? 'ただし Google AI Plus 以上の契約が必要。課金の意思が無いなら、当面は Claude の音声モードで「今日の予定を教えて」を試すのが現実的です。' : 'Google AI Plus 以上の契約で使えます。'));
  }
  if (score.spark >= 2){
    html += rec('Gemini Live の Spark（数日〜数週間の長時間タスク）',
      'Claude に相当機能がない領域です。' + (score.paid === 0 ? 'Google AI Pro 以上が必要なので、課金の意思が固まってからでよい枠です。' : 'Google AI Pro 以上で使えます。移動中に喋った断片を資料の骨子にする、といった用途向け。'));
  }
  if (gaps.length === 0){
    html += rec('今回のアップデートで急いで動く必要は薄い',
      '文章・コード・調査が中心なら、主軸は Claude のままで問題ありません。録音の文字起こしや動画づくりが発生したら、そのときに Gemini を足せば十分です。', true);
  }

  html += '<div class="rec none"><div class="t">共通の進め方</div><div class="d">穴は一度に1つだけ埋める。導入前後で「その作業にかけた時間」を数え、減らなければ元に戻す。Gemini Live の新機能は対象の国・言語が公式未発表なので、文字起こし・動画は AI Studio / Flow から先に触れます。</div></div>';
  html += '<div class="nav restart"><button id="rs">もう一度</button></div></div>';
  app.innerHTML = html;
  app.querySelector('#rs').onclick = () => {
    step = 0; picks.fill(null);
    for (const k in score) score[k] = 0;
    render();
  };
}
render();
</script>
</body>
</html>
