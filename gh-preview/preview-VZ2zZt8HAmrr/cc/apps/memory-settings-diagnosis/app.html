<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Memory設定診断アプリ</title>
<meta name="description" content="4つの質問に答えるだけで、あなたの使い方に合ったClaude Memoryのおすすめ設定(記憶ON/OFF・機微情報の扱い・共有時の注意)を診断するミニアプリ。">
<style>
  :root{
    --brand:#D9774F; --brand-deep:#C15640; --brand-soft:rgba(217,119,79,.12); --brand-line:rgba(217,119,79,.30);
    --bg:#F1ECE3; --paper:#FBF8F2; --ink:#2A2620; --ink-mid:#6E6557; --ink-sub:#A39A8B; --line:#E4D9C7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;line-height:1.7;padding:24px 14px;}
  .wrap{max-width:560px;margin:0 auto;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  h1{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:6px;}
  .sub{font-size:13.5px;color:var(--ink-mid);margin-bottom:22px;}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px;}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .25s;}
  .q{display:none;}
  .q.active{display:block;}
  .qtitle{font-size:16px;font-weight:900;margin-bottom:14px;}
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:14.5px;color:var(--ink);cursor:pointer;transition:.15s;}
  .opt:hover{border-color:var(--brand);background:var(--brand-soft);}
  .opt.picked{border-color:var(--brand);border-width:2px;background:var(--brand-soft);font-weight:700;}
  .navrow{display:flex;justify-content:space-between;margin-top:20px;}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:900;cursor:pointer;}
  .btn:disabled{background:var(--line);color:var(--ink-sub);cursor:not-allowed;}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink-mid);}
  .result{display:none;}
  .result.active{display:block;}
  .card{background:var(--bg);border:1.5px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .card h3{font-size:14.5px;font-weight:900;margin-bottom:6px;color:var(--brand-deep);}
  .card p{font-size:13.5px;color:var(--ink);}
  .restart{margin-top:16px;}
  .badge{display:inline-block;background:var(--brand-soft);color:var(--brand-deep);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:900;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 Claude Memory設定診断アプリ</h1>
  <p class="sub">4つの質問に答えると、あなたの使い方に合ったおすすめ設定が分かります。</p>
  <div class="bar"><i id="barfill" style="width:0%"></i></div>

  <div class="q active" data-q="0">
    <div class="qtitle">Q1. 主にどこでClaudeを使っていますか?</div>
    <button class="opt" data-v="personal">普段のチャット(chat)がほとんど</button>
    <button class="opt" data-v="cowork">Coworkで長時間タスクも任せる</button>
    <button class="opt" data-v="team">チーム・組織のアカウントで使う</button>
  </div>

  <div class="q" data-q="1">
    <div class="qtitle">Q2. 健康・宗教・政治・家族構成など、人には見られたくないが答えると便利な話題を相談することがありますか?</div>
    <button class="opt" data-v="yes">よくある</button>
    <button class="opt" data-v="sometimes">たまにある</button>
    <button class="opt" data-v="no">ほとんどない</button>
  </div>

  <div class="q" data-q="2">
    <div class="qtitle">Q3. 会話やコードのやり取りを、リンクで他の人に共有することがありますか?</div>
    <button class="opt" data-v="often">よくある(チームで作業内容を見せる)</button>
    <button class="opt" data-v="rare">たまにある</button>
    <button class="opt" data-v="never">ほぼない</button>
  </div>

  <div class="q" data-q="3">
    <div class="qtitle">Q4. 記憶が「古い情報のまま」になっていないか、自分で見直す習慣はありますか?</div>
    <button class="opt" data-v="habit">定期的に見直している</button>
    <button class="opt" data-v="none">特に意識したことがない</button>
  </div>

  <div class="navrow" id="navrow">
    <button class="btn ghost" id="backBtn" disabled>← 戻る</button>
    <button class="btn" id="nextBtn" disabled>次へ →</button>
  </div>

  <div class="result" id="result">
    <span class="badge">診断結果</span>
    <div id="resultCards"></div>
    <button class="btn restart" id="restartBtn">もう一度診断する</button>
  </div>
</div>

<script>
  const answers = {};
  let cur = 0;
  const total = 4;
  const qs = document.querySelectorAll('.q');

  function updateBar(){
    document.getElementById('barfill').style.width = Math.round((cur/total)*100) + '%';
  }

  function showQ(n){
    qs.forEach(q => q.classList.remove('active'));
    qs[n].classList.add('active');
    document.getElementById('backBtn').disabled = (n === 0);
    const key = qs[n].dataset.q;
    document.getElementById('nextBtn').disabled = !(key in answers);
    document.getElementById('nextBtn').textContent = (n === total - 1) ? '結果を見る →' : '次へ →';
    updateBar();
  }

  qs.forEach((q, qi) => {
    q.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        q.querySelectorAll('.opt').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        answers[qi] = btn.dataset.v;
        document.getElementById('nextBtn').disabled = false;
      });
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(cur < total - 1){ cur++; showQ(cur); }
    else { showResult(); }
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    if(cur > 0){ cur--; showQ(cur); }
  });
  document.getElementById('restartBtn').addEventListener('click', () => {
    cur = 0; for(const k in answers) delete answers[k];
    document.querySelectorAll('.opt.picked').forEach(b=>b.classList.remove('picked'));
    document.getElementById('result').classList.remove('active');
    document.getElementById('navrow').style.display = 'flex';
    qs.forEach(q=>q.style.display='');
    showQ(0);
  });

  function showResult(){
    const cards = [];
    const usage = answers[0], sensitive = answers[1], sharing = answers[2], habit = answers[3];

    if(usage === 'team'){
      cards.push({h:'記憶はまず管理者に確認を', p:'Team・Enterpriseプランでは、Memoryは初期状態でOFFになっています。管理者がONにするまでは有効になりません。まず自分の組織の設定状況を管理者に確認しましょう。'});
    } else {
      cards.push({h:'記憶はデフォルトONのままでOK', p:'Free・Pro・Maxプランでは、chatとCoworkの記憶は最初からONになっています。特に理由がなければ、そのまま使い始めて問題ありません。'});
    }

    if(sensitive === 'yes'){
      cards.push({h:'「機微な話題を含める」はONも検討', p:'健康・宗教などの相談が多いなら、設定で「機微な話題を含める」をONにすると、次回以降その文脈を踏まえた提案が受けられます。ただし身分証番号・犯罪歴・移民ステータスなどは、ONにしても記憶されない仕様です。'});
    } else if(sensitive === 'sometimes'){
      cards.push({h:'機微な話題はデフォルトのままが無難', p:'「たまにある」程度なら、機微情報はデフォルトOFF(記憶しない)のままにしておくのがおすすめです。必要な時だけ会話内で明示的に伝える方が管理しやすくなります。'});
    } else {
      cards.push({h:'機微な話題の設定は変更不要', p:'デフォルトのまま(健康・宗教・政治などは記憶しない)で十分カバーできています。特に設定を変える必要はありません。'});
    }

    if(sharing === 'often'){
      cards.push({h:'共有前レビューを毎回のルーティンに', p:'読み取り専用リンクでの共有が多いなら、送信前にパス・diff・画像などの機微情報が残っていないか目視確認する手順を、チームのルールとして決めておきましょう。'});
    } else if(sharing === 'rare'){
      cards.push({h:'共有するときだけ一呼吸置く', p:'頻度は高くなくても、共有リンクは誰でも閲覧できる点は変わりません。送る前に一度だけ中身を見直す習慣をつけておくと安心です。'});
    } else {
      cards.push({h:'共有機能は今は様子見でOK', p:'今のところ共有の予定がなければ、無理に使う必要はありません。必要になったタイミングで、共有前レビューの注意点だけ思い出してください。'});
    }

    if(habit === 'none'){
      cards.push({h:'月1回、Topics一覧を見る予定を入れよう', p:'Claude設定 → Memory → Topicsで、記憶されている内容を一覧で確認・編集・削除できます。カレンダーに月1回のチェック予定を入れておくと、記憶違いや古い情報を溜め込まずに済みます。'});
    } else {
      cards.push({h:'その習慣、そのまま続けてください', p:'定期的な見直しは、記憶機能を安心して使い続けるための一番の近道です。今のペースを維持しましょう。'});
    }

    const html = cards.map(c => `<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('');
    document.getElementById('resultCards').innerHTML = html;
    qs.forEach(q=>q.style.display='none');
    document.getElementById('navrow').style.display = 'none';
    document.getElementById('result').classList.add('active');
    document.getElementById('barfill').style.width = '100%';
  }

  showQ(0);
</script>
</body>
</html>
