<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>このAIニュース鵜呑み度診断アプリ</title>
<meta name="description" content="4つの質問に答えるだけで、目にしたAIニュースをそのまま信じていいか・裏取りが必要かを判定する信頼度診断ミニアプリ。Ox Alphaのような正体不明モデルの話題にも使える。">
<style>
  :root{
    --brand:#1C3461; --brand-deep:#16284A; --brand-soft:rgba(28,52,97,.10); --brand-line:rgba(28,52,97,.28);
    --accent:#5BBCD4; --accent-deep:#2C7A93;
    --bg:#F7FAFC; --paper:#FFFFFF; --ink:#1C3461; --ink-mid:#4A6080; --ink-sub:#8098B4; --line:rgba(28,52,97,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;line-height:1.7;padding:24px 14px;}
  .wrap{max-width:560px;margin:0 auto;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  h1{font-size:21px;font-weight:900;color:var(--ink);margin-bottom:6px;}
  .sub{font-size:13.5px;color:var(--ink-mid);margin-bottom:22px;}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s;}
  .q{display:none;}
  .q.active{display:block;}
  .qtitle{font-size:16px;font-weight:900;margin-bottom:14px;}
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:14.5px;color:var(--ink);cursor:pointer;transition:.15s;}
  .opt:hover{border-color:var(--accent);background:rgba(91,188,212,.10);}
  .opt.picked{border-color:var(--brand);border-width:2px;background:var(--brand-soft);font-weight:700;}
  .navrow{display:flex;justify-content:space-between;margin-top:20px;}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:900;cursor:pointer;}
  .btn:disabled{background:var(--line);color:var(--ink-sub);cursor:not-allowed;}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink-mid);}
  .result{display:none;}
  .result.active{display:block;}
  .scorebox{text-align:center;background:var(--brand-soft);border:1.5px solid var(--brand-line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .scorebox .lvl{font-size:26px;font-weight:900;color:var(--brand-deep);}
  .scorebox .desc{font-size:13.5px;color:var(--ink-mid);margin-top:6px;}
  .card{background:var(--bg);border:1.5px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .card h3{font-size:14.5px;font-weight:900;margin-bottom:6px;color:var(--accent-deep);}
  .card p{font-size:13.5px;color:var(--ink);}
  .restart{margin-top:16px;}
  .badge{display:inline-block;background:rgba(91,188,212,.16);color:var(--accent-deep);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:900;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 このAIニュース鵜呑み度診断アプリ</h1>
  <p class="sub">気になったAIニュース・新モデルの話題を思い浮かべながら、4つの質問に答えてください。「そのまま信じていいか」「裏取りしてから判断すべきか」が分かります。</p>
  <div class="bar"><i id="barfill" style="width:0%"></i></div>

  <div class="q active" data-q="0">
    <div class="qtitle">Q1. その情報は、どこで見つけましたか?</div>
    <button class="opt" data-v="official">公式ブログ・公式ドキュメント・公式Xアカウントの投稿</button>
    <button class="opt" data-v="news">ニュースサイト・まとめ記事</button>
    <button class="opt" data-v="secondhand">SNSでの又聞き・解説動画の受け売り</button>
  </div>

  <div class="q" data-q="1">
    <div class="qtitle">Q2. 「〇倍速い」「〇%安い」のような数字が出てきましたか? 出てきたなら、比較対象と出典は書いてありましたか?</div>
    <button class="opt" data-v="clear">何と何を比べた数字か・出典まで書いてある</button>
    <button class="opt" data-v="vague">数字はあるが、比較対象や出典があいまい</button>
    <button class="opt" data-v="none">「大幅に」「かなり」など形容詞だけで数字がない</button>
  </div>

  <div class="q" data-q="2">
    <div class="qtitle">Q3. そのサービス・モデルを作った会社・開発元は、はっきり分かりますか?</div>
    <button class="opt" data-v="clear">公式に明記されている</button>
    <button class="opt" data-v="rumor">噂・推測レベルでしか分からない</button>
    <button class="opt" data-v="hidden">開発元が非公開・匿名と明言されている(ステルスモデル等)</button>
  </div>

  <div class="q" data-q="3">
    <div class="qtitle">Q4. それを使う・信じることで、あなたは機密情報や個人情報を渡すことになりますか?</div>
    <button class="opt" data-v="no">渡さない(読むだけ・試すだけ)</button>
    <button class="opt" data-v="some">簡単な作業データくらいは渡すかもしれない</button>
    <button class="opt" data-v="yes">仕事の機密情報や個人情報を入力する予定</button>
  </div>

  <div class="navrow" id="navrow">
    <button class="btn ghost" id="backBtn" disabled>← 戻る</button>
    <button class="btn" id="nextBtn" disabled>次へ →</button>
  </div>

  <div class="result" id="result">
    <span class="badge">診断結果</span>
    <div class="scorebox">
      <div class="lvl" id="lvlText"></div>
      <div class="desc" id="lvlDesc"></div>
    </div>
    <div id="resultCards"></div>
    <button class="btn restart" id="restartBtn">もう一度診断する</button>
  </div>
</div>

<script>
  const answers = {};
  let cur = 0;
  const total = 4;
  const qs = document.querySelectorAll('.q');

  function updateBar(){
    document.getElementById('barfill').style.width = Math.round((cur/total)*100) + '%';
  }

  function showQ(n){
    qs.forEach(q => q.classList.remove('active'));
    qs[n].classList.add('active');
    document.getElementById('backBtn').disabled = (n === 0);
    const key = qs[n].dataset.q;
    document.getElementById('nextBtn').disabled = !(key in answers);
    document.getElementById('nextBtn').textContent = (n === total - 1) ? '結果を見る →' : '次へ →';
    updateBar();
  }

  qs.forEach((q, qi) => {
    q.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        q.querySelectorAll('.opt').forEach(b => b.classList.remove('picked'));
        btn.classList.add('picked');
        answers[qi] = btn.dataset.v;
        document.getElementById('nextBtn').disabled = false;
      });
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if(cur < total - 1){ cur++; showQ(cur); }
    else { showResult(); }
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    if(cur > 0){ cur--; showQ(cur); }
  });
  document.getElementById('restartBtn').addEventListener('click', () => {
    cur = 0; for(const k in answers) delete answers[k];
    document.querySelectorAll('.opt.picked').forEach(b=>b.classList.remove('picked'));
    document.getElementById('result').classList.remove('active');
    document.getElementById('navrow').style.display = 'flex';
    qs.forEach(q=>q.style.display='');
    showQ(0);
  });

  const SCORE = {
    0: {official:2, news:1, secondhand:0},
    1: {clear:2, vague:1, none:0},
    2: {clear:2, rumor:1, hidden:0},
    3: {no:2, some:1, yes:0}
  };

  function showResult(){
    const cards = [];
    const source = answers[0], numbers = answers[1], origin = answers[2], data = answers[3];
    let score = 0;
    for(let i=0;i<4;i++) score += SCORE[i][answers[i]];

    let lvl, desc;
    if(score >= 7){ lvl = '🟢 そのまま話して大丈夫'; desc = 'この情報は一次情報で裏取りできる状態です。ただし数字や開発元は今後変わることもあるので、時々見直しましょう。'; }
    else if(score >= 4){ lvl = '🟡 もう一段、裏取りしてから'; desc = '一部はまだ確認が甘いポイントがあります。下のカードの項目だけ確認すれば、安心して人に話せる状態になります。'; }
    else { lvl = '🔴 今はまだ様子見推奨'; desc = '出典・数字・開発元のいずれかが不確かなままです。断定的に紹介するのは避け、「〜という情報がある」程度の伝え方にとどめましょう。'; }
    document.getElementById('lvlText').textContent = lvl;
    document.getElementById('lvlDesc').textContent = desc;

    if(source === 'official'){
      cards.push({h:'情報源はそのままでOK', p:'公式発表を直接見ているので、この点は最も信頼できる状態です。他の項目の確認に集中しましょう。'});
    } else if(source === 'news'){
      cards.push({h:'元になった公式ページを探そう', p:'ニュースサイトやまとめ記事は「一次情報を探す手がかり」までです。記事中で言及されている会社名・製品名で検索し、公式ブログや公式Xの元投稿を直接確認してから人に伝えましょう。'});
    } else {
      cards.push({h:'又聞きのまま広めない', p:'SNSでの又聞きや解説動画の受け売りは、伝言ゲームで内容がずれていることがあります。まず元の公式情報にたどり着けるか探し、見つからなければその主張ごと保留にしましょう。'});
    }

    if(numbers === 'clear'){
      cards.push({h:'数字の根拠はクリア', p:'比較対象・条件・出典が揃っているので、その数字はそのまま紹介して問題ありません。'});
    } else if(numbers === 'vague'){
      cards.push({h:'「何と何を比べた数字か」を確認', p:'数字自体はあっても、比較対象があいまいだと誤解を招きます。公式ページやリリースノートに戻り、条件(旧バージョン比か・競合比かなど)を確認してから使いましょう。'});
    } else {
      cards.push({h:'形容詞だけの主張は保留に', p:'「大幅に」「かなり」だけで具体的な数字がない主張は、資料や会話でそのまま使わないのが安全です。数字が見つからなければ、その部分は紹介しないという判断も選択肢です。'});
    }

    if(origin === 'clear'){
      cards.push({h:'開発元が明確なら通常の警戒レベルでOK', p:'提供元がはっきりしているサービスは、通常の利用規約確認で十分です。'});
    } else if(origin === 'rumor'){
      cards.push({h:'噂レベルの開発元情報は断定しない', p:'「〇〇社が作ったらしい」という噂は、独自の技術検証止まりで公式確認がないケースが多いです。紹介するときは「開発元は推測の域」と明言しましょう。'});
    } else {
      cards.push({h:'ステルスモデルは機密情報を渡さない', p:'開発元が非公開と明言されているサービス(ステルスモデル等)は、入力内容がどう扱われるか保証がありません。試すのは公開情報の範囲にとどめ、様子見の姿勢を保ちましょう。'});
    }

    if(data === 'yes'){
      cards.push({h:'機密情報を渡す前に一呼吸', p:'仕事の機密情報や個人情報を入力する予定があるなら、Q1〜Q3の答えに関わらず、まずは自社のセキュリティポリシー・利用規約を確認してからにしましょう。'});
    } else if(data === 'some'){
      cards.push({h:'渡すデータの範囲を決めておく', p:'「ここまでは渡してよい」という線引きを事前に決めておくと、あとで後悔しにくくなります。'});
    } else {
      cards.push({h:'試すだけなら気軽にどうぞ', p:'読む・試すだけであれば、リスクは限定的です。新しい情報に触れる練習として活用しましょう。'});
    }

    const html = cards.map(c => `<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('');
    document.getElementById('resultCards').innerHTML = html;
    qs.forEach(q=>q.style.display='none');
    document.getElementById('navrow').style.display = 'none';
    document.getElementById('result').classList.add('active');
    document.getElementById('barfill').style.width = '100%';
  }

  showQ(0);
</script>
</body>
</html>
